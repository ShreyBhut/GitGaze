version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Mount the host C drive to allow the backend to analyze local repositories on Windows
      # Docker Desktop on Windows maps C:\ to /c/ or /host_mnt/c depending on the WSL setup
      - /c:/c
    env_file:
      - .env
    environment:
      - TESTING=0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Prevent host node_modules from overriding container node_modules
      - /app/node_modules
    environment:
      - CI=true
    depends_on:
      - backend